name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog clang lld llvm
          python -m pip install cocotb pytest

      - name: Lint
        run: make lint

      - name: Unit tests (cocotb)
        run: make test-unit PYTHON=python

      - name: riscv-tests (rv32ui)
        run: make test-isa

      - name: Random co-simulation
        run: make test-random

      - name: C programs and benchmarks
        run: make test-sw
